<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create your Laundry Express OS Owner account.">
  <title>Create Owner Account | Laundry Express OS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(53,198,208,.20), transparent 35%),
        linear-gradient(135deg, #f5fbff 0%, #ffffff 55%, #eefaff 100%);
      color: #082d5b;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #dceaf2;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(8,45,91,.12);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-wrap img {
      width: 230px;
      max-width: 80%;
      height: auto;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      color: #082d5b;
    }

    .subtitle {
      text-align: center;
      color: #66788a;
      line-height: 1.5;
      margin: 10px 0 28px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 17px 0 7px;
      color: #082d5b;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #cbdbe5;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
      color: #102a43;
    }

    input:focus {
      border-color: #0289d6;
      box-shadow: 0 0 0 3px rgba(2,137,214,.10);
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      color: #81909d;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 25px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #075b66, #0289d6);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.04);
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    #message.error {
      display: block;
      background: #fff1f1;
      color: #a52828;
      border: 1px solid #f2cccc;
    }

    #message.success {
      display: block;
      background: #eefbf7;
      color: #116149;
      border: 1px solid #c8eadf;
    }

    .bottom {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #66788a;
    }

    .bottom a,
    .back {
      color: #0289d6;
      font-weight: 700;
      text-decoration: none;
    }

    .back-row {
      text-align: center;
      margin-top: 20px;
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card">

      <div class="logo-wrap">
        <img src="assets/logo-horizontal.png" alt="Laundry Express OS">
      </div>

      <h1>Create Owner Account</h1>

      <p class="subtitle">
        Create your secure Laundry Express OS account and set up your business.
      </p>

      <form id="signupForm">

        <label for="businessName">Business Name</label>
        <input
          id="businessName"
          type="text"
          maxlength="100"
          autocomplete="organization"
          placeholder="Example: Laundry Express"
          required
        >

        <label for="branchName">First Branch Name</label>
        <input
          id="branchName"
          type="text"
          maxlength="100"
          value="Main Branch"
          placeholder="Main Branch"
          required
        >

        <label for="email">Owner Email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="owner@example.com"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Create a secure password"
          required
        >
        <div class="hint">Use at least 8 characters.</div>

        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="Enter your password again"
          required
        >

        <button id="createButton" type="submit">
          Create Owner Account
        </button>

        <div id="message" role="alert" aria-live="polite"></div>

      </form>

      <div class="bottom">
        Already have an account?
        <a href="login.html">Log in</a>
      </div>

      <div class="back-row">
        <a class="back" href="index.html">← Back to Laundry Express OS</a>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const form = document.getElementById("signupForm");
    const button = document.getElementById("createButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const businessName =
        document.getElementById("businessName").value.trim();

      const branchName =
        document.getElementById("branchName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (businessName.length < 2) {
        showMessage("Please enter a valid business name.", "error");
        return;
      }

      if (branchName.length < 2) {
        showMessage("Please enter a valid branch name.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";
      message.style.display = "none";

      try {

        const { data: signupData, error: signupError } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              emailRedirectTo:
                window.location.origin +
                window.location.pathname.replace(
                  "signup.html",
                  "login.html"
                )
            }
          });

        if (signupError) {
          throw signupError;
        }

        /*
          If Supabase requires email confirmation,
          signup succeeds but there is no active session yet.

          We must NOT call create_owner_business until
          the user is authenticated.
        */
        if (!signupData.session) {

          showMessage(
            "Account created. Please check your email and confirm your account. After confirmation, log in to finish setting up your business.",
            "success"
          );

          form.reset();
          document.getElementById("branchName").value = "Main Branch";

          return;
        }

        /*
          If email confirmation is disabled and Supabase
          gives us a session immediately, we can safely
          create the Owner's business now.
        */
        const { data: businessData, error: businessError } =
          await supabaseClient.rpc(
            "create_owner_business",
            {
              p_business_name: businessName,
              p_branch_name: branchName
            }
          );

        if (businessError) {
          throw businessError;
        }

        showMessage(
          "Owner account and business created successfully.",
          "success"
        );

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (error) {

        console.error("Signup error:", error);

        showMessage(
          error.message || "Unable to create your account. Please try again.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Create Owner Account";

      }
    });
  </script>

</body>
</html>
