<body><aside><a class="brand" href="/">LAUNDRY<br>EXPRESS <small>OWNER PORTAL</small></a></aside><main><h1>Reset your password</h1><p id="status" role="status" aria-live="polite"></p><section class="panel narrow"><form id="request"><p>Enter your owner-account email. We’ll send you a reset link.</p><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><button>Send reset link</button></form><form id="reset" hidden><label>New password<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label><button>Save new password</button></form><p><a href="/owner">Back to sign in</a></p></section></main></body></html>
