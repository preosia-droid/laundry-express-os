services:
  - type: web
    name: laundry-express-owner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'webapp:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
